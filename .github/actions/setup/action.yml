name: "Setup MoonBit"
description: "Setup MoonBit CLI in your GitHub Actions workflow"
inputs:
  version:
    description: "MoonBit CLI version; defaults to the last verified website release toolchain"
    required: false
    # The website and its dependencies still use moon.mod.json, unsupported by 0.10.15.
    default: "0.10.14+7d59c7ec9"
runs:
  using: "composite"
  steps:
    - name: Install MoonBit CLI on *nix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ inputs.version }}"
        echo "$HOME/.moon/bin" >> $GITHUB_PATH

    - name: Install MoonBit CLI on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        MOONBIT_INSTALL_VERSION: ${{ inputs.version }}
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
        "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Verify installation
      shell: bash
      run: |
        moon version --all

    - name: Update Registry
      shell: bash
      run: |
        moon update
