name: Release

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Language to publish
        type: choice
        options: [all, en, zh]
        default: all
      target:
        description: Chinese deployment destination
        type: choice
        options: [aws, both, aliyun]
        default: aws
      aws_account:
        description: AWS account to publish (both keeps the rollback copy current)
        type: choice
        options: [legacy, moonbit, both]
        default: legacy

permissions:
  contents: read
  id-token: write

jobs:
  en-publish:
    if: inputs.locale != 'zh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: install
        uses: ./.github/actions/setup
      - id: build
        env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        run: |
          pnpm i
          pnpm build -l en
      - name: Upload English website to legacy AWS
        if: inputs.aws_account != 'moonbit'
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
        run: |
          aws s3 sync ./build s3://www.moonbitlang.com --exclude llms.txt --delete
          aws cloudfront create-invalidation --distribution-id ${{secrets.AWS_CLOUDFRONT_HOMEPAGE_DISTRIBUTION_ID}} --paths "/*"
      - name: Authenticate to MoonBit AWS
        id: moonbit-credentials
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (inputs.aws_account == 'moonbit' || inputs.aws_account == 'both') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MOONBIT_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.AWS_MOONBIT_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload English website to MoonBit AWS
        if: ${{ !cancelled() && steps.moonbit-credentials.outcome == 'success' }}
        env:
          BUCKET: ${{ secrets.AWS_MOONBIT_EN_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.AWS_MOONBIT_EN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 sync ./build "s3://$BUCKET" --exclude llms.txt --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Status' --output text

  zh-publish:
    if: inputs.locale != 'en'
    concurrency:
      group: publish-website-cn
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: install
        uses: ./.github/actions/setup
      - id: build
        env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        run: |
          pnpm i
          pnpm build -l zh
      - uses: aliyun/setup-aliyun-cli-action@v1
        if: inputs.target == 'aliyun' || inputs.target == 'both'
      - name: upload
        if: inputs.target == 'aliyun' || inputs.target == 'both'
        run: |
          aliyun configure set --profile default --mode AK --access-key-id ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_ID}} --access-key-secret ${{secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET}} --region ${{secrets.ALIBABA_REGION}}
          aliyun oss sync ./build ${{secrets.ALIYUN_OSS_BUCKET}} --exclude llms.txt --delete --force
          aliyun esa PurgeCaches --region cn-shenzhen --Content '{"CacheKeys":[{}],"Directories":["https://www.moonbitlang.cn/"]}' --Type directory --SiteId 1189399586245168
      - name: Upload Chinese website to AWS
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.target != 'aliyun' && inputs.aws_account != 'moonbit' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET: ${{ vars.AWS_CN_HOMEPAGE_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.AWS_CN_HOMEPAGE_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 sync ./build "s3://$BUCKET" --exclude llms.txt --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
      - name: Authenticate to MoonBit AWS
        id: moonbit-credentials
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (inputs.aws_account == 'moonbit' || inputs.aws_account == 'both') && inputs.target != 'aliyun' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MOONBIT_ROLE_ARN }}
          aws-region: us-west-2
          allowed-account-ids: ${{ secrets.AWS_MOONBIT_ACCOUNT_ID }}
          mask-aws-account-id: true
      - name: Upload Chinese website to MoonBit AWS
        if: ${{ !cancelled() && steps.moonbit-credentials.outcome == 'success' }}
        env:
          BUCKET: ${{ secrets.AWS_MOONBIT_CN_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.AWS_MOONBIT_CN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 sync ./build "s3://$BUCKET" --exclude llms.txt --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Status' --output text
