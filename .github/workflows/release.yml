name: Release

on:
  workflow_dispatch:
    inputs:
      locale:
        description: Language to publish
        type: choice
        options: [all, en, zh]
        default: all
      target:
        description: Chinese deployment destination
        type: choice
        options: [aws, both, aliyun]
        default: aliyun

jobs:
  en-publish:
    if: inputs.locale != 'zh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: install
        uses: ./.github/actions/setup
      - env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        run: |
          pnpm i
          pnpm build -l en
      - name: upload
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_MOONBIT_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_MOONBIT_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
          BUCKET: ${{ secrets.AWS_MOONBIT_EN_BUCKET }}
        run: |
          aws s3 sync ./build "s3://$BUCKET" --exclude llms.txt --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id ${{secrets.AWS_MOONBIT_EN_DISTRIBUTION_ID}} --paths "/*" --query 'Invalidation.Status' --output text

  zh-publish:
    if: inputs.locale != 'en'
    concurrency:
      group: publish-website-cn
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: install
        uses: ./.github/actions/setup
      - id: build
        env:
          GITHUB_TOKEN: "${{secrets.GITHUB_TOKEN}}"
        run: |
          pnpm i
          pnpm build -l zh
      - uses: aliyun/setup-aliyun-cli-action@v1
        if: inputs.target == 'aliyun' || inputs.target == 'both'
      - name: Install OSS upload tool
        if: inputs.target == 'aliyun' || inputs.target == 'both'
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh -o /tmp/install-ossutil.sh
          sudo bash /tmp/install-ossutil.sh
      - name: Upload Chinese website to OSS and refresh ESA
        if: inputs.target == 'aliyun' || inputs.target == 'both'
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ESA_SITE_ID: ${{ vars.ALIYUN_ESA_SITE_ID }}
        run: |
          test -n "$BUCKET" && test -n "$ESA_SITE_ID"
          aliyun configure set --profile default --mode AK --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" --region cn-hangzhou
          ossutil config --endpoint oss-cn-shenzhen.aliyuncs.com --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"
          ossutil sync ./build "$BUCKET" --exclude llms.txt --delete --force
          aliyun esa PurgeCaches --region cn-hangzhou --Content '{"Directories":["https://www.moonbitlang.cn/","https://moonbitlang.cn/"]}' --Type directory --SiteId "$ESA_SITE_ID"
      - name: Upload Chinese website to AWS
        if: ${{ !cancelled() && steps.build.outcome == 'success' && inputs.target != 'aliyun' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_MOONBIT_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_MOONBIT_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
          BUCKET: ${{ secrets.AWS_MOONBIT_CN_BUCKET }}
          DISTRIBUTION_ID: ${{ secrets.AWS_MOONBIT_CN_DISTRIBUTION_ID }}
        run: |
          test -n "$BUCKET" && test -n "$DISTRIBUTION_ID"
          aws s3 sync ./build "s3://$BUCKET" --exclude llms.txt --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Status' --output text
